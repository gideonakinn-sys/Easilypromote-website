    />
    <meta property="og:title" content="EasilyPromote — Deploy thousands of content creators to work for your product" />
    <meta
      property="og:description"
      content="Nigeria&rsquo;s creator-powered distribution platform. Thousands of creators, ready to create engaging content for your product and put it in front of their audiences."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>EasilyPromote — Creator-powered distribution for your product</title>
  </head>
  <body class="is-preloading">
    <div id="root"></div>

    <!--
      The intro gate locks scrolling until the hero reveal lands. If the module
      never boots, this releases it so the page is still readable.
    -->
    <script>
      // Only fires if the motion module never booted. Home.tsx stamps
      // "motion-ready" as soon as it takes ownership of the card, so a slow
      // intro is never mistaken for a failure.
      setTimeout(function () {
        if (document.documentElement.classList.contains("motion-ready")) return
        document.body.classList.remove("is-preloading")
        document.documentElement.classList.add("motion-failed")
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
