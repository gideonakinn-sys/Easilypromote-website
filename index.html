<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark%201.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f4" />
    <meta
      name="description"
      content="EasilyPromote is a performance marketing marketplace connecting Nigerian businesses with content creators. Fund a campaign upfront, approve every piece of content before it goes public, and creators earn on views verified through platform APIs."
    />
    <meta property="og:title" content="EasilyPromote — Nothing goes live until you say so" />
    <meta
      property="og:description"
      content="Fund a campaign upfront. Approve every post before it's published. Creators earn on views verified through platform APIs."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.easilypromote.com/" />
    <link rel="canonical" href="https://www.easilypromote.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>EasilyPromote — Nothing goes live until you say so</title>
  </head>
  <body class="is-preloading">
    <div id="root"></div>

    <!--
      The home page is client-rendered so the hero can animate in from a hidden
      state, which leaves nothing in the markup for a reader that does not run
      JavaScript. The other routes are prerendered (scripts/prerender.mjs); this
      is the equivalent for this one.
    -->
    <noscript>
      <h1>EasilyPromote</h1>
      <p>
        EasilyPromote is a performance marketing marketplace connecting
        Nigerian businesses with content creators. A business funds a campaign
        upfront, creators claim placements and produce the content, and every
        submission is approved by the business before it is published. Once
        approved content is live on the creator's own account, view counts are
        read from the platform's API — TikTok, Instagram, YouTube or X, with
        the creator's authorisation — and creators are paid on those verified
        views.
      </p>
      <p>
        <a href="/about">About EasilyPromote</a> &middot;
        <a href="/terms">Terms and Conditions</a> &middot;
        <a href="/privacy">Privacy Policy</a> &middot;
        <a href="mailto:easilypromote@gmail.com">easilypromote@gmail.com</a>
      </p>
    </noscript>

    <!--
      The intro gate locks scrolling until the hero reveal lands. If the module
      never boots, this releases it so the page is still readable.
    -->
    <script>
      // Only fires if the motion module never booted. Home.tsx stamps
      // "motion-ready" as soon as it takes ownership of the card, so a slow
      // intro is never mistaken for a failure.
      setTimeout(function () {
        if (document.documentElement.classList.contains("motion-ready")) return
        document.body.classList.remove("is-preloading")
        document.documentElement.classList.add("motion-failed")
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
